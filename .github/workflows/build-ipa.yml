name: Build iOS IPA (iOS 16)

on:
  workflow_dispatch:
  push:
    branches: [main, ios16]

jobs:
  build:
    # macos-26 镜像自带 Xcode 26（工程引用了 iOS 26 SDK 的 Glass 类型，必须 26 编译）
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: List Xcode versions
        run: ls /Applications | grep -i xcode || true

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "未找到 Xcode 26，可改用 setup-xcode 安装" >&2
            exit 1
          fi
          echo "使用 $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install xcodegen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: ios
        shell: bash
        run: |
          xcodebuild \
            -project ZCodeMobile.xcodeproj \
            -scheme ZCodeMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIREMENT=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP=ios/build/Build/Products/Release-iphoneos/ZCodeMobile.app
          test -d "$APP" || { echo "构建产物缺失"; exit 1; }
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ZCodeMobile-ios16.ipa Payload
          ls -la ZCodeMobile-ios16.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZCodeMobile-ios16-ipa
          path: ZCodeMobile-ios16.ipa
          retention-days: 30

  screenshots:
    # iOS 模拟器手机模拟操作验证：XCUITest 按用户流程逐屏点按 + 断言 + 截图
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC"
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build for testing
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ZCodeMobile.xcodeproj -scheme ZCodeMobile             -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild             CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|BUILD" | tail -30
      - name: Boot simulator
        run: |
          xcrun simctl list devices available | grep iPhone || true
          UDID=$(xcrun simctl list devices available | grep iPhone | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}" | head -1)
          echo "iPhone udid: $UDID" | tee device.txt
          test -n "$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
      - name: Run UI verification tests
        working-directory: ios
        run: |
          set -o pipefail
          UDID=$(cat ../device.txt)
          echo "destination id=$UDID"
          XCRUN_FILE=$(find simbuild/Build/Products -name '*.xctestrun' | head -1)
          xcodebuild test-without-building -xctestrun "$XCRUN_FILE" -destination "id=$UDID"             -only-testing:ZCodeMobileUITests -resultBundlePath ../uiresults.xcresult             2>&1 | grep -E "Test Case|Test Suite|passed|failed|error:" | tail -80
      - name: Export step screenshots
        run: |
          xcrun xcresulttool export attachments --path uiresults.xcresult --output-path shots || true
          ls shots 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: ui-verification
          path: |
            shots
            uiresults.xcresult
          retention-days: 7
