name: Build iOS IPA (iOS 16)

on:
  workflow_dispatch:
  push:
    branches: [main, ios16]

jobs:
  build:
    # macos-26 镜像自带 Xcode 26（工程引用了 iOS 26 SDK 的 Glass 类型，必须 26 编译）
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: List Xcode versions
        run: ls /Applications | grep -i xcode || true

      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then
            echo "未找到 Xcode 26，可改用 setup-xcode 安装" >&2
            exit 1
          fi
          echo "使用 $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install xcodegen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned device app
        working-directory: ios
        shell: bash
        run: |
          xcodebuild \
            -project ZCodeMobile.xcodeproj \
            -scheme ZCodeMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIREMENT=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP=ios/build/Build/Products/Release-iphoneos/ZCodeMobile.app
          test -d "$APP" || { echo "构建产物缺失"; exit 1; }
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ZCodeMobile-ios16.ipa Payload
          ls -la ZCodeMobile-ios16.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZCodeMobile-ios16-ipa
          path: ZCodeMobile-ios16.ipa
          retention-days: 30

  screenshots:
    # 在 iOS 模拟器里真跑 App 并截图（演示界面用）
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XC"
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Build simulator app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild -project ZCodeMobile.xcodeproj -scheme ZCodeMobile -configuration Debug             -destination 'generic/platform=iOS Simulator' -derivedDataPath simbuild build             CODE_SIGNING_ALLOWED=NO 2>&1 | grep -E "error:|warning: [A-Za-z]|BUILD" | tail -30
      - name: Boot simulator, install, launch, screenshot
        run: |
          UDID=$(xcrun simctl list devices available | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}" | head -1)
          echo "device udid: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" ios/simbuild/Build/Products/Debug-iphonesimulator/ZCodeMobile.app
          xcrun simctl launch "$UDID" dev.paco.zcode.mobile
          sleep 12
          xcrun simctl io "$UDID" screenshot shot-1-onboarding.png
          xcrun simctl terminate "$UDID" dev.paco.zcode.mobile || true
          sleep 2
          xcrun simctl launch "$UDID" dev.paco.zcode.mobile material-calibration || true
          sleep 8
          xcrun simctl io "$UDID" screenshot shot-2-glass.png || true
      - uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: shot-*.png
          retention-days: 7
